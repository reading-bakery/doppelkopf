<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weiterspielen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Protest+Strike&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">

  
    <link rel="stylesheet" href="themes.css">  
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="newgame.css">
    <link rel="stylesheet" href="scrollnav.css">
    <link rel="stylesheet" href="topbutton.css">
    <link rel="stylesheet" href="weitergame.css">
    <link rel="stylesheet" href="footer.css">


    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="setup.js" defer></script>
    <script src="navbar.js" defer></script>
    <script src="weitergame.js" defer></script>


</head>
<body>

    <div id="nav-placeholder"></div>

    <h1>Weiter</h1>

    <h2>Da weitermachen, wo man aufgehört hat</h2>
  
<div class="game-container" id="open-games-list">
        <div class="loading-text">Lade offene Spiele...</div>
    </div>

    <div id="game-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal-btn">&times;</button>
            
            <div id="modal-step-1" class="modal-step active">
                <h3>Spieltyp & Ansage</h3>
                <p>Wer spielt das Solo / die Hochzeit?</p>
                <div class="player-options-grid" id="modal-players-list">
                    </div>
                <button type="button" class="modal-btn next-step-btn" id="to-step-2">Weiter</button>
            </div>

            <div id="modal-step-2" class="modal-step">
                <h3>Ergebnis eintragen</h3>
                <p id="selected-player-info" style="color: var(--accent-color, #13c913); font-weight: bold;"></p>
                
                <div class="input-group">
                    <label for="modal-points">Erreichte Augen (Punkte):</label>
                    <input type="number" id="modal-points" min="0" max="240" placeholder="z.B. 142">
                </div>
                
                <div class="input-group">
                    <label for="modal-tricks">Anzahl Stiche:</label>
                    <input type="number" id="modal-tricks" min="0" max="12" placeholder="z.B. 8">
                </div>

                <div class="modal-buttons-row">
                    <button type="button" class="modal-btn back-btn" id="back-to-step-1">Zurück</button>
                    <button type="button" class="modal-btn save-btn" id="save-game-score">Speichern</button>
                </div>
            </div>
        </div>
    </div>

    <div id="topbutton-placeholder"></div>
    <div id="footer-placeholder"></div>
</body>

    <div id="topbutton-placeholder"></div>
    <div id="footer-placeholder"></div>

</body>
</html>
