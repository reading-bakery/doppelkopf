<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neues Spiel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Protest+Strike&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">

  
    <link rel="stylesheet" href="themes.css">  
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="newgame.css">
    <link rel="stylesheet" href="scrollnav.css">
    <link rel="stylesheet" href="topbutton.css">
    <link rel="stylesheet" href="footer.css">


    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="setup.js" defer></script>
    <script src="navbar.js" defer></script>
    <script src="newgame.js" defer></script>


</head>
<body>

    <div id="nav-placeholder"></div>

    <h1>Neues Spiel</h1>

    <h2>Die Dulle sticht!</h2>
  
    <div class="game-container">
        <!-- Button zum Öffnen des Modals -->
        <button id="open-modal-btn" class="btn-primary">Neues Spiel starten </button>
    </div> 

    <!-- Das Modal-Overlay (Hintergrund) und Fenster -->
    <div id="game-modal" class="modal-overlay">
        <div class="modal-content">
            <span id="close-modal-btn" class="modal-close">&times;</span>
            <h3>Neues Spiel beginnen</h3>
            
            <form id="new-game-form">
                <div class="form-group">
                    <label for="game-date">Datum</label>
                    <input type="date" id="game-date" name="gameDate" placeholder="Datum" required>
                </div>


                <div class="form-group">
                    <label for="player1">Name Spieler 1</label>
                    <input type="text" id="player1" name="player1" placeholder="Spieler 1" required>
                </div>

                <div class="form-group">
                    <label for="player1">Name Spieler 2</label>
                    <input type="text" id="player2" name="player2" placeholder="Spieler 2" required>
                </div>

                <div class="form-group">
                    <label for="player3">Name Spieler 3</label>
                    <input type="text" id="player3" name="player3" placeholder="Spieler 3" required>
                </div>

                <div class="form-group">
                    <label for="player4">Name Spieler 4</label>
                    <input type="text" id="player4" name="player4" placeholder="Spieler 4" required>
                </div>
                
                <div class="form-group">
                    <label for="game-round">Runden</label>
                    <input type="number" id="game-round" name="gameRound" placeholder="Anzahl Runden" required>
                </div>

                <button type="submit" class="btn-submit">Spiel starten</button>
            </form>
        </div>
    </div>

    <div id="topbutton-placeholder"></div>
    <div id="footer-placeholder"></div>

</body>
</html>
